# gitleaks 設定。デフォルトルールを継承しつつ、Claude Code 系の OAuth/session
# トークンも検出できるようカスタムルールを足す。
# 実行: `gitleaks git` (履歴) / `gitleaks git --staged` (pre-commit)

title = "ama gitleaks config"

[extend]
useDefault = true

# ── カスタムルール ────────────────────────────────────────────
# v8.30 default ruleset には Anthropic Console の API キー (sk-ant-api03-) と
# Admin キー (sk-ant-admin01-) のルールがあるが、Claude Code が発行する
# OAuth access token のルールが無いので追加する。
#
# 注: Claude Code の "session" 識別子 (sesn_...) は bearer token ではなく
# 単なる会話 ID なのでルール対象外。

[[rules]]
id = "anthropic-oauth-access-token"
description = "Anthropic / Claude Code OAuth access token (sk-ant-oat01-)"
regex = '''\b(sk-ant-oat01-[a-zA-Z0-9_\-]{50,})\b'''
keywords = ["sk-ant-oat01"]

# ── allowlist ────────────────────────────────────────────────
# 秘密情報そのものではない、binary / vendored / generated 出力。実際の
# credential を allowlist してはいけない。
[[allowlists]]
description = "binary / vendored / generated assets"
paths = [
  '''(^|/)bin/native/.*\.(a|so|dll|dylib)$''',
  '''(^|/)bin/wasm/ama\.(wasm|js)$''',
  '''(^|/)bin/native/.*/obj/.*''',
  '''(^|/)selfplay\.jsonl$''',                  # selfplay 棋譜 (ハイエントロピーだが秘密ではない)
]
